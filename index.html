<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ecf4fb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- Pretendard: 네 앱 공통 본문 폰트. dynamic-subset은 unicode-range로 쪼개져 있어
     실제로 화면에 쓰인 글자 조각만 내려받는다(한글 전체 폰트는 1MB가 넘는다). -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>변호사시험 대비.zip</title>
<script src="core/store.js"></script>
<script>
// 테마: 허브는 lawhub_theme을 쓰되, 없으면 CASE_Practice의 cp_theme을 물려받는다.
(function(){
  var t = localStorage.getItem('lawhub_theme') || localStorage.getItem('cp_theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
/* ── CASE_Practice / MCQ와 동일한 색 토큰 ─────────────── */
:root[data-theme="dark"]{
  --bg:#10192a; --sf:#172238; --sf2:#1d2d48; --bd:#284060; --bd2:#1e3254;
  --gold:#7ab8d8; --gold2:#9acce8; --gf:#2e6282;
  --tx:#cce6f8; --tx2:#6aa8cc; --tx3:#366078;
  --hd:#0c1424; --ok:#4ade80; --no:#f87171; --shadow:0 1px 3px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --bg:#ecf4fb; --sf:#ffffff; --sf2:#dceef8; --bd:#b4d0e8; --bd2:#cce0f2;
  --gold:#2464a0; --gold2:#2e74b5; --gf:#2a5f88;
  --tx:#192233; --tx2:#3a5870; --tx3:#5878a0;
  --hd:#16233a; --ok:#16a34a; --no:#dc2626; --shadow:0 1px 3px rgba(30,60,100,.10);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,
    "Segoe UI","Malgun Gothic",sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:16px}

.hd{background:var(--hd);color:#e8f2fb;padding:13px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;z-index:30}
.hd h1{margin:0;font-size:16.5px;letter-spacing:-.02em;font-weight:700}
.hd .sub{font-size:11.5px;opacity:.72;margin-top:2px}

.btn{background:var(--sf);color:var(--tx);border:1px solid var(--bd);
  border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--gold2)}
.btn:disabled{opacity:.42;cursor:default}
.btn.ghost{background:transparent;color:#cfe3f5;border-color:rgba(255,255,255,.22)}
.btn.ghost:hover{border-color:#9acce8}

.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;
  padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;
  background:var(--sf2);color:var(--tx2);border:1px solid var(--bd2)}
.tag.gold{background:var(--sf2);color:var(--gold);border-color:var(--gold);font-weight:600}
.tag.ok{background:var(--sf2);color:var(--ok);border-color:var(--ok)}
.muted{color:var(--tx3);font-size:12px}
.title{font-size:14.5px;font-weight:700;margin:0 0 9px;color:var(--tx)}
.empty{text-align:center;color:var(--tx3);padding:44px 16px}
input[type=text]{background:var(--sf);color:var(--tx);border:1px solid var(--bd);
  border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit}
input[type=text]:focus{outline:none;border-color:var(--gold)}

/* ── 로그인·앱선택 장면 (MCQ와 같은 글래스모피즘) ───── */
/* 배경은 MCQ의 .bg-scene을 그대로 옮겼다. 두 사이트가 같은 화면으로 보여야 한다. */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden}
.scene .bg{position:absolute;inset:0;
  background:
    radial-gradient(1200px 800px at 18% 12%, rgba(52,96,168,.28), transparent 60%),
    radial-gradient(1000px 700px at 82% 78%, rgba(122,84,168,.20), transparent 62%),
    radial-gradient(900px 600px at 60% 20%, rgba(28,72,124,.22), transparent 58%),
    linear-gradient(160deg,#050a16 0%,#081428 45%,#040a18 100%);
  animation:bgdrift 32s ease-in-out infinite alternate}
/* 배경 사진 — 그라디언트 위에 덮인다. 사진이 없거나 늦게 오면 그라디언트가 그대로 보인다. */
.scene .photo{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:0;transition:opacity .5s ease}
.scene .photo.on{opacity:1}
.scene .veil{position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(4,12,28,.25) 0%,rgba(8,20,45,.2) 50%,rgba(2,8,20,.3) 100%)}
/* 사진이 깔리면 더 짙게 덮는다. 밝은 밤하늘 사진에서는 그라디언트용으로 잡은
   옅은 베일로는 흰 글씨가 묻힌다. 가운데(카드 자리)를 특히 어둡게 두고
   가장자리는 사진이 살아 있게 남긴다. */
.scene.has-photo .veil{
  background:
    radial-gradient(880px 620px at 50% 52%,
      rgba(2,8,20,.74) 0%, rgba(2,8,20,.46) 62%, rgba(2,8,20,.34) 100%),
    linear-gradient(160deg,rgba(4,12,28,.48) 0%,rgba(8,20,45,.4) 50%,rgba(2,8,20,.52) 100%)}
@keyframes bgdrift{
  from{background-position:0% 0%,100% 100%,50% 0%,0 0}
  to{background-position:12% 8%,88% 92%,42% 10%,0 0}
}
@media(prefers-reduced-motion:reduce){.scene .bg{animation:none}}

.scene-wrap{position:relative;z-index:1;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px}
.scene-box{width:100%;max-width:440px}
.scene-head{text-align:center;margin-bottom:24px}
.scene-logo{font-size:31px;font-weight:900;color:#fff;margin-bottom:7px;letter-spacing:-.3px;
  text-shadow:0 0 18px rgba(120,180,255,.7),0 2px 8px rgba(0,0,0,.9)}
.scene-logo .ext{font-weight:400;opacity:.6;letter-spacing:0}
.scene-tagline{font-size:13.5px;color:rgba(220,235,255,.92);line-height:1.6;margin-bottom:6px;
  word-break:keep-all;text-shadow:0 1px 6px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.8)}
.scene-desc{font-size:12.5px;color:rgba(190,215,245,.8);line-height:1.6;
  text-shadow:0 1px 6px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.8)}
.glass{background:transparent;border:2px solid rgba(255,255,255,.75);border-radius:22px;
  padding:28px 26px;
  box-shadow:0 0 18px rgba(140,190,255,.3),0 0 40px rgba(100,160,255,.15),
    inset 0 0 18px rgba(140,190,255,.06)}
.glass-label{font-size:13px;color:#fff;margin-bottom:6px;font-weight:600;letter-spacing:.03em;
  text-shadow:0 1px 6px rgba(0,0,0,.9)}
.glass-input{width:100%;box-sizing:border-box;font-family:inherit;font-size:15px;
  padding:11px 15px;border:1px solid rgba(255,255,255,.55);border-radius:12px;outline:none;
  background:rgba(255,255,255,.1);color:#fff;margin-bottom:10px;transition:all .18s;
  box-shadow:0 0 8px rgba(180,210,255,.2)}
.glass-input::placeholder{color:rgba(200,220,255,.55)}
.glass-input:focus{border-color:rgba(130,190,255,.9);background:rgba(255,255,255,.15);
  box-shadow:0 0 0 3px rgba(100,160,255,.15),0 0 12px rgba(130,190,255,.35)}
.glass-btn{width:100%;padding:13px;background:rgba(100,160,255,.35);color:#fff;
  border:1px solid rgba(140,190,255,.7);border-radius:12px;
  font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s;
  box-shadow:0 0 12px rgba(100,160,255,.4),0 4px 16px rgba(60,120,255,.25)}
.glass-btn:hover{background:rgba(120,175,255,.45)}
.glass-note{font-size:12px;color:rgba(210,228,255,.75);margin-top:12px;text-align:center;
  text-shadow:0 1px 5px rgba(0,0,0,.8)}

/* 앱 선택 — MCQ 과목선택 버튼과 같은 반투명 카드 */
.pick{display:block;width:100%;text-align:left;text-decoration:none;
  padding:16px 19px;border-radius:12px;margin-bottom:10px;
  border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.72);cursor:pointer;font-family:inherit;
  transition:border-color .15s,background .15s,box-shadow .15s}
.pick:hover{border-color:rgba(130,190,255,.85);background:rgba(255,255,255,.1);
  color:#fff;box-shadow:0 0 20px rgba(100,160,255,.3)}
.pick .t{font-size:15.5px;font-weight:700;letter-spacing:.02em}
.pick .d{font-size:12.5px;opacity:.62;margin-top:2px;font-weight:400}
.pick.off{opacity:.42;cursor:default;pointer-events:none}
.pick .rt{float:right;font-size:11px;opacity:.55;font-weight:400}

/* ── 학습 현황 ──────────────────────────────────── */
.stats{display:grid;gap:9px}
@media(min-width:640px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--sf2);border:1px solid var(--bd2);border-radius:10px;padding:12px 14px}
.stat .n{font-size:20px;font-weight:700;color:var(--gold);letter-spacing:-.02em}
.stat .l{font-size:11.5px;color:var(--tx3);margin-top:1px}
table.sub{width:100%;border-collapse:collapse;margin-top:13px;font-size:13px}
table.sub th{text-align:left;font-weight:500;color:var(--tx3);font-size:11.5px;
  padding:6px 8px;border-bottom:1px solid var(--bd)}
table.sub td{padding:8px;border-bottom:1px solid var(--bd2);color:var(--tx2)}
table.sub td:first-child{color:var(--tx);font-weight:600}
table.sub th:not(:first-child),table.sub td:not(:first-child){text-align:right}
</style>
</head>
<body>

<!-- 로그인 / 앱선택 — MCQ와 같은 배경 위의 투명창 -->
<div id="scene" class="scene" hidden>
  <div class="bg"></div><div class="photo" id="bgPhoto"></div><div class="veil"></div>
</div>
<div id="sceneWrap" class="scene-wrap" hidden>
  <div class="scene-box">
    <div class="scene-head">
      <div class="scene-logo">변호사시험 대비<span class="ext">.zip</span></div>
      <div class="scene-tagline">개념학습 &amp; 선택형·사례형·기록형 학습을 한 곳에서</div>
      <div class="scene-desc" id="sceneDesc"></div>
    </div>
    <div class="glass" id="sceneCard"></div>
    <div class="glass-note" id="sceneNote"></div>
  </div>
</div>

<!-- 대시보드 -->
<div id="hub" hidden>
  <div class="hd">
    <div>
      <h1>변호사시험 대비<span style="font-weight:400;opacity:.6">.zip</span></h1>
      <div class="sub" id="hdSub">불러오는 중...</div>
    </div>
    <div class="row">
      <button class="btn ghost" id="pickBtn" title="앱 선택으로">앱 선택</button>
      <button class="btn ghost" id="themeBtn" title="테마 전환">🌙</button>
      <button class="btn ghost" id="userBtn" hidden>나가기</button>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="title">학습 현황</div>
      <div id="dash"><div class="muted">집계 중...</div></div>
    </div>
    <div class="muted" style="text-align:center;padding:8px 0 24px" id="swNote"></div>
  </div>
</div>

<script>
'use strict';

// ── 표시 헬퍼 ─────────────────────────────────────
const SUBJECT_ORDER = ['공법','형사법','민사법','국제법','국제거래법'];
const MODE_LABEL = { mcq:'선택형', case:'사례형', memo:'암기장', record:'기록형' };

const pad = n => String(n).padStart(2,'0');
const fmtDate = ts => { const d = new Date(ts);
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`; };
function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec||0));
  const h = Math.floor(sec/3600), m = Math.round((sec%3600)/60);
  if(h && m) return `${h}시간 ${m}분`;
  if(h) return `${h}시간`;
  if(m) return `${m}분`;
  return sec ? `${sec}초` : '—';
}
const el = (t,cls,txt)=>{ const e=document.createElement(t);
  if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };

// ── 테마 ─────────────────────────────────────────
const themeBtn = document.getElementById('themeBtn');
function paintTheme(){
  const t = document.documentElement.getAttribute('data-theme') || 'light';
  themeBtn.textContent = t === 'light' ? '🌙' : '☀';
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t === 'light' ? '#ecf4fb' : '#10192a');
}
themeBtn.addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('lawhub_theme', next);
  paintTheme();
});
paintTheme();

// ── 화면 ─────────────────────────────────────────
// login → pick(앱 선택) → hub(대시보드). 앞의 둘은 MCQ와 같은 투명창이다.
const dash = document.getElementById('dash');
const hdSub = document.getElementById('hdSub');
const userBtn = document.getElementById('userBtn');
const scene = document.getElementById('scene');
const sceneWrap = document.getElementById('sceneWrap');
const sceneCard = document.getElementById('sceneCard');
const sceneDesc = document.getElementById('sceneDesc');
const sceneNote = document.getElementById('sceneNote');
const hub = document.getElementById('hub');

// MCQ는 로그인한 ID를 자기 키(`hub_last_uid`)에 저장하고, 다음 방문 때 그 값이
// 있으면 PIN을 묻지 않고 바로 들어간다. 같은 오리진이라 localStorage는 공유되지만
// 키 이름이 달라 그냥 두면 허브 로그인과 MCQ 로그인이 서로를 모른다.
// 두 키를 함께 맞춰 두어, 어느 쪽에서 로그인하든 이어지게 한다.
const MCQ_UID_KEY = 'hub_last_uid';

// 로그인·앱선택 화면의 배경 사진. 새로고침할 때마다 이 중 하나가 무작위로 뜬다.
// 목록을 비우면 CSS 그라디언트만 남는다. 사진을 늘리거나 줄이려면 여기만 고치면 된다.
const BG_PHOTOS = [
  'assets/bg/1.webp', 'assets/bg/2.webp', 'assets/bg/3.webp',
  'assets/bg/4.webp', 'assets/bg/5.webp', 'assets/bg/6.webp',
];

function paintBackdrop(){
  if(!BG_PHOTOS.length) return;
  const pick = BG_PHOTOS[Math.floor(Math.random() * BG_PHOTOS.length)];
  const layer = document.getElementById('bgPhoto');
  // 다 받은 뒤에 얹는다. 중간에 그리면 사진이 위에서부터 그려지는 게 보인다.
  const img = new Image();
  img.onload = ()=>{
    layer.style.backgroundImage = 'url("' + pick + '")';
    layer.classList.add('on');
    document.getElementById('scene').classList.add('has-photo');
  };
  img.onerror = ()=>{ /* 사진이 없으면 그라디언트로 둔다 */ };
  img.src = pick;
}

function syncUid(uid){
  try{
    if(uid) localStorage.setItem(MCQ_UID_KEY, uid);
    else localStorage.removeItem(MCQ_UID_KEY);
  }catch(e){ /* 저장소를 못 써도 허브는 계속 뜬다 */ }
}

function setUser(uid){
  Store.setUser(uid);
  syncUid(uid);
}

const APPS = [
  { href:'/Core_Notes/',    name:'암기장',  desc:'개념 정리와 쟁점 카드 반복 암기' },
  { href:'/MCQ/',           name:'선택형',  desc:'객관식 문제 풀이와 오답 관리' },
  { href:'/CASE_Practice/', name:'사례형',  desc:'변시·모의 기출 사례형 답안 작성' },
  { href:null,              name:'기록형',  desc:'아직 구축되지 않았습니다', off:true },
];

let backdropPainted = false;
function showScene(kind){
  const onScene = kind !== 'hub';
  if(onScene && !backdropPainted){ backdropPainted = true; paintBackdrop(); }
  scene.hidden = sceneWrap.hidden = !onScene;
  hub.hidden = onScene;
  // 장면 화면은 어두운 배경 위에 얹히므로 테마와 무관하게 배경을 어둡게 둔다
  document.body.style.background = onScene ? '#050a16' : '';
}

function renderPick(uid){
  showScene('pick');
  sceneDesc.hidden = false;
  sceneDesc.textContent = uid + ' 님 · 학습할 유형을 고르세요';
  sceneCard.textContent = '';
  for(const a of APPS){
    const node = a.off ? el('div','pick off') : document.createElement('a');
    if(!a.off){ node.className = 'pick'; node.href = a.href; }
    const t = el('div','t', a.name);
    if(a.off) t.appendChild(el('span','rt','준비 중'));
    node.appendChild(t);
    node.appendChild(el('div','d', a.desc));
    sceneCard.appendChild(node);
  }
  const more = el('button','glass-btn','학습 현황 보기');
  more.style.marginTop = '6px';
  more.addEventListener('click', ()=>{ showScene('hub'); });
  sceneCard.appendChild(more);
  sceneNote.textContent = '네 앱이 같은 기록을 공유합니다 · 답안 전문은 기기 밖으로 나가지 않습니다';
}

function renderLogin(){
  showScene('login');
  // 로그인 화면에서는 부제만 둔다 — 여기에 한 줄 더 넣으면 같은 말이 두 번 나온다
  sceneDesc.hidden = true;
  sceneCard.textContent = '';
  sceneCard.appendChild(el('div','glass-label','사용자 ID'));
  const input = document.createElement('input');
  input.type = 'text'; input.className = 'glass-input';
  input.placeholder = '아이디를 입력하세요'; input.autocomplete = 'username';
  const btn = el('button','glass-btn','시작하기');
  const submit = ()=>{ const v = input.value.trim(); if(!v) return; setUser(v); boot(); };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e=>{ if(e.key === 'Enter') submit(); });
  sceneCard.appendChild(input);
  sceneCard.appendChild(btn);
  sceneNote.textContent = '네 앱이 같은 사용자 ID를 공유합니다 · 이 기기에만 저장됩니다';
  input.focus();
}

// 과목별 학습량 집계 — 푼 문제 수 · 총 학습시간 · 최근 학습일
function aggregate(records){
  const bySubject = new Map();
  let seconds = 0, last = 0;
  for(const r of records){
    const key = r.subject || '(과목 없음)';
    let e = bySubject.get(key);
    if(!e){ e = { subject:key, count:0, seconds:0, last:0, modes:new Set() }; bySubject.set(key, e); }
    e.count++;
    e.seconds += r.seconds || 0;
    e.last = Math.max(e.last, r.at || 0);
    if(r.mode) e.modes.add(r.mode);
    seconds += r.seconds || 0;
    last = Math.max(last, r.at || 0);
  }
  const rows = [...bySubject.values()].sort((a,b)=>{
    const ia = SUBJECT_ORDER.indexOf(a.subject), ib = SUBJECT_ORDER.indexOf(b.subject);
    if(ia !== ib) return (ia<0?99:ia) - (ib<0?99:ib);
    return a.subject.localeCompare(b.subject, 'ko');
  });
  return { rows, total:records.length, seconds, last };
}

function renderDashboard(records){
  dash.textContent = '';
  if(!records.length){
    const e = el('div','empty','아직 학습 기록이 없습니다');
    e.appendChild(el('div','muted','앱에서 문제를 풀면 여기에 과목별 학습량이 쌓입니다.'));
    dash.appendChild(e);
    return;
  }
  const agg = aggregate(records);

  const stats = el('div','stats');
  [[agg.total.toLocaleString('ko-KR')+'건','푼 문제 수'],
   [fmtDuration(agg.seconds),'총 학습시간'],
   [agg.last ? fmtDate(agg.last) : '—','최근 학습일']].forEach(([n,l])=>{
    const s = el('div','stat'); s.appendChild(el('div','n',n)); s.appendChild(el('div','l',l));
    stats.appendChild(s);
  });
  dash.appendChild(stats);

  const tbl = el('table','sub');
  const thead = el('thead'), htr = el('tr');
  ['과목','푼 문제 수','학습시간','최근 학습일'].forEach(h=>htr.appendChild(el('th',null,h)));
  thead.appendChild(htr); tbl.appendChild(thead);
  const tbody = el('tbody');
  for(const r of agg.rows){
    const tr = el('tr');
    const first = el('td');
    first.appendChild(document.createTextNode(r.subject));
    const modes = [...r.modes].map(m=>MODE_LABEL[m]||m).join(' · ');
    if(modes){ const sp = el('span','muted',' '+modes); sp.style.fontWeight='400'; first.appendChild(sp); }
    tr.appendChild(first);
    tr.appendChild(el('td',null, r.count.toLocaleString('ko-KR')+'건'));
    tr.appendChild(el('td',null, fmtDuration(r.seconds)));
    tr.appendChild(el('td',null, r.last ? fmtDate(r.last) : '—'));
    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);
  dash.appendChild(tbl);
}

userBtn.addEventListener('click', ()=>{ setUser(null); boot(); });
document.getElementById('pickBtn').addEventListener('click', ()=>{
  const uid = Store.getUser();
  if(uid) renderPick(uid); else renderLogin();
});

// ── 부팅 ─────────────────────────────────────────
async function boot(){
  let uid = null;
  try{
    const st = await Store.init({});
    uid = st.uid;
  }catch(e){
    showScene('hub');
    hdSub.textContent = '저장소를 열 수 없습니다';
    dash.textContent = '';
    dash.appendChild(el('div','empty','브라우저 저장소를 사용할 수 없어 학습 현황을 표시할 수 없습니다'));
    return;
  }

  // 허브를 거치지 않고 MCQ에서 먼저 로그인했다면 그 ID를 이어받는다
  if(!uid){
    let prior = null;
    try{ prior = localStorage.getItem(MCQ_UID_KEY); }catch(e){}
    if(prior){ Store.setUser(prior); uid = prior; }
  }
  if(!uid){ renderLogin(); return; }
  syncUid(uid);

  let records = [];
  try{
    records = await Store.getRecords({});
  }catch(e){
    records = [];   // 기록을 못 읽어도 허브는 떠 있어야 한다
  }
  hdSub.textContent = `${uid} · 기록 ${records.length}건`;
  userBtn.hidden = false;
  renderDashboard(records);
  renderPick(uid);   // 로그인 상태의 첫 화면은 앱 선택
}

boot();

// ── 서비스워커 (file://에서는 등록되지 않는다) ─────
const swNote = document.getElementById('swNote');
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  // 새 워커가 자리를 넘겨받으면 한 번만 새로고침한다. 이렇게 하지 않으면
  // 이미 설치된 옛 워커가 캐시한 화면을 한 번 더 보게 된다.
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(reloading) return;
    reloading = true;
    location.reload();
  });
  navigator.serviceWorker.register('sw.js', { scope: './' })
    .then(reg=>{
      swNote.textContent = '오프라인 사용 준비됨 (scope: ' + reg.scope + ')';
      reg.update().catch(()=>{});
    })
    .catch(err=>{ swNote.textContent = '오프라인 캐시를 켜지 못했습니다: ' + err.message; });
}else{
  swNote.textContent = 'http(s)로 열면 오프라인 사용이 켜집니다.';
}
</script>
</body>
