<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>의견함 — 관리자</title>
<link rel="icon" href="/icon-256.png" type="image/png">
<!-- 이 쪽만 따로 「의견함」 앱으로 홈 화면에 올릴 수 있게 — 아이폰은 홈 화면 앱이어야 웹 푸시가 온다 -->
<link rel="manifest" href="/feedback-admin.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="의견함">
<!--
  의견함(관리자용). 앱의 「의견 보내기」로 들어온 글을 읽고, 읽음·처리함을 표시한다.

  이 쪽은 누구나 주소를 알면 열 수 있다 — 그래서 **쪽 자체에는 아무것도 없다.**
  글은 워커가 갖고 있고, 워커는 관리자 열쇠(FEEDBACK_ADMIN_KEY)가 맞을 때만 내준다.
  열쇠는 이 파일에도 저장소에도 없다. 워커에 직접 넣은 사람만 안다:
      cd CASE_Practice/worker && npx wrangler secret put FEEDBACK_ADMIN_KEY
  여기에 한 번 입력하면 이 기기의 localStorage 에만 남는다.

  폰 알림(웹 푸시): 맨 위 「알림 켜기」. 열쇠 없이도 켤 수 있지만 신청은 「승인 대기」로 들어가고,
  관리자가 노트북에서  npm run feedback -- push-ok N  으로 승인해야 의견이 온다.
  받은 의견은 이 기기 안(서비스워커 Cache 'fb-inbox')에 쌓여 「이 기기에 온 의견」에 보인다.

  ⚠ 들어온 글은 남이 쓴 것이다. 반드시 textContent 로만 넣는다(innerHTML 금지).
-->
<style>
:root{--bg:#eef3f8;--sf:#fff;--tx:#1f2d3a;--tx2:#5b6b7a;--bd:#c9d6e2;--ac:#2f5d8a;--no:#b3261e;--ok:#1b7a43;--gold:#a8741a}
@media(prefers-color-scheme:dark){:root{--bg:#161c23;--sf:#1f2731;--tx:#e6edf3;--tx2:#9aa9b8;--bd:#3a4654;--ac:#7fb0de;--no:#ff8a80;--ok:#7bd49b;--gold:#e0b25c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
main{max-width:860px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:19px;margin:0 0 4px}
.muted{color:var(--tx2);font-size:12.5px}
.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:16px 0 14px}
button,input{font:inherit}
.btn{min-height:38px;padding:0 13px;border-radius:9px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);cursor:pointer}
.btn.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 15px;margin-bottom:11px}
.card.new{border-left:4px solid var(--gold)}
.card.done{opacity:.62}
.head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--tx2);margin-bottom:7px}
.tag{padding:1px 8px;border-radius:10px;border:1px solid var(--bd);font-size:12px;color:var(--tx)}
.tag.k오류{color:var(--no);border-color:var(--no)}
.body{white-space:pre-wrap;word-break:break-word;font-size:15px}
.ctx{margin-top:9px;padding-top:8px;border-top:1px dashed var(--bd);font-size:12.5px;color:var(--tx2);word-break:break-all}
.note{margin-top:8px;font-size:13px;color:var(--ok)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts input{flex:1;min-width:150px;height:32px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);padding:0 9px;font-size:13px}
.gate{max-width:420px;margin:60px auto;text-align:center}
.gate input{width:100%;height:42px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);padding:0 12px;margin:14px 0 10px}
.err{color:var(--no);font-size:13.5px;margin-top:10px}
.empty{text-align:center;color:var(--tx2);padding:50px 10px}
.push{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.push .grow{flex:1;min-width:200px}
.sec{font-size:15px;margin:22px 0 10px}
.okc{color:var(--ok)} .warn{color:var(--gold)}
</style>
</head>
<body>
<main>
  <h1>의견함</h1>
  <div class="card push">
    <div class="grow">
      <b>이 기기로 새 의견 알림 받기</b>
      <div id="pushState" class="muted">확인하는 중…</div>
    </div>
    <button id="pushOn" class="btn on" hidden>알림 켜기</button>
    <button id="pushOff" class="btn sm" hidden>이 기기 알림 끄기</button>
  </div>

  <h2 class="sec">이 기기에 온 의견 <span id="inboxN" class="muted"></span></h2>
  <div id="inbox"></div>

  <h2 class="sec">서버 의견함 전체</h2>
  <div id="gate" class="gate" hidden style="margin-top:10px">
    <div class="muted">관리자 열쇠를 넣으면 이 기기에 기억해 둡니다.</div>
    <input id="key" type="password" placeholder="관리자 열쇠" autocomplete="off">
    <button id="enter" class="btn on" style="width:100%">열기</button>
    <div id="gateErr" class="err" hidden></div>
  </div>

  <div id="app" hidden>
    <div id="counts" class="muted"></div>
    <div class="bar">
      <button class="btn on" data-f="new">새 것</button>
      <button class="btn" data-f="seen">읽음</button>
      <button class="btn" data-f="done">처리함</button>
      <button class="btn" data-f="">전체</button>
      <span style="flex:1"></span>
      <button id="reload" class="btn">새로 고침</button>
      <button id="forget" class="btn">이 기기에서 열쇠 지우기</button>
    </div>
    <div id="list"></div>
  </div>
</main>

<script>
(function(){
  'use strict';
  var ENDPOINT = 'https://case-grader.bar-exam.workers.dev/feedback';
  var KEY = 'law_fb_admin_key';
  var $ = function(id){ return document.getElementById(id); };
  var filter = 'new';

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined && text !== null) e.textContent = text;   // 남이 쓴 글 — textContent 만
    return e;
  }
  function kst(ts){               // D1 은 UTC 로 적는다
    var d = new Date(String(ts).replace(' ','T') + 'Z');
    if(isNaN(d)) return ts;
    return d.toLocaleString('ko-KR', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
  }
  function key(){ try{ return localStorage.getItem(KEY) || ''; }catch(e){ return ''; } }

  function call(method, body, qs){
    return fetch(ENDPOINT + (qs||''), {
      method: method,
      headers: Object.assign({'Authorization':'Bearer ' + key()}, body ? {'Content-Type':'application/json'} : {}),
      body: body ? JSON.stringify(body) : undefined,
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){
        if(!r.ok){ var e = new Error(j.error || ('오류 ' + r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
  }

  function showGate(msg){
    $('app').hidden = true; $('gate').hidden = false;
    $('gateErr').hidden = !msg; $('gateErr').textContent = msg || '';
    if(msg) $('key').focus();   // 처음 열 때는 자판을 띄우지 않는다(폰에서 알림 칸이 밀려 올라간다)
  }

  function load(){
    $('list').textContent = '';
    $('list').appendChild(el('div','empty','불러오는 중…'));
    call('GET', null, '?limit=200' + (filter ? '&status=' + filter : '')).then(function(d){
      $('gate').hidden = true; $('app').hidden = false;
      var c = {}; (d.counts||[]).forEach(function(r){ c[r.status] = r.n; });
      $('counts').textContent = '새 것 ' + (c.new||0) + ' · 읽음 ' + (c.seen||0) + ' · 처리함 ' + (c.done||0);
      document.title = ((c.new||0) ? '(' + c.new + ') ' : '') + '의견함 — 관리자';
      render(d.rows||[]);
    }).catch(function(e){
      if(e.status === 401){ try{ localStorage.removeItem(KEY); }catch(x){} showGate('열쇠가 맞지 않습니다.'); return; }
      if(e.status === 503){ showGate('워커에 관리자 열쇠가 아직 없습니다. worker 폴더에서 npx wrangler secret put FEEDBACK_ADMIN_KEY 를 먼저 실행하세요.'); return; }
      $('list').textContent = '';
      $('list').appendChild(el('div','err', e.message));
    });
  }

  function render(rows){
    var list = $('list'); list.textContent = '';
    if(!rows.length){ list.appendChild(el('div','empty', filter==='new' ? '새 의견이 없습니다.' : '해당하는 의견이 없습니다.')); return; }
    rows.forEach(function(r){
      var card = el('div','card ' + r.status);
      var head = el('div','head');
      head.appendChild(el('span','tag', r.app));
      head.appendChild(el('span','tag k' + r.kind, r.kind));
      head.appendChild(el('span', null, '#' + r.id + ' · ' + kst(r.ts)));
      if(r.user) head.appendChild(el('span', null, '· ' + r.user));
      card.appendChild(head);
      card.appendChild(el('div','body', r.text));

      var ctx = {}; try{ ctx = JSON.parse(r.ctx || '{}'); }catch(e){}
      var bits = [];
      if(ctx.path) bits.push('화면: ' + ctx.path);
      if(ctx.heads && ctx.heads.length) bits.push('제목: ' + ctx.heads.join(' › '));
      if(ctx.vw) bits.push('기기: ' + ctx.vw + '×' + ctx.vh + (ctx.theme ? ' · ' + ctx.theme : ''));
      if(ctx.extra) bits.push('덧붙임: ' + JSON.stringify(ctx.extra));
      if(r.contact) bits.push('연락처: ' + r.contact);
      if(bits.length){
        var c = el('div','ctx');
        bits.forEach(function(b){ c.appendChild(el('div', null, b)); });
        card.appendChild(c);
      }
      if(r.note) card.appendChild(el('div','note','메모: ' + r.note));

      var acts = el('div','acts');
      var memo = el('input'); memo.type = 'text'; memo.placeholder = '메모 (무엇을 고쳤는지)'; memo.maxLength = 1000;
      function mark(status){
        call('PATCH', {id: r.id, status: status, note: memo.value.trim() || undefined}).then(load)
          .catch(function(e){ alert(e.message); });
      }
      if(r.status !== 'seen' && r.status !== 'done'){
        var b1 = el('button','btn sm','읽음'); b1.onclick = function(){ mark('seen'); }; acts.appendChild(b1);
      }
      if(r.status !== 'done'){
        acts.appendChild(memo);
        var b2 = el('button','btn sm on','처리함'); b2.onclick = function(){ mark('done'); }; acts.appendChild(b2);
      } else {
        var b3 = el('button','btn sm','다시 열기'); b3.onclick = function(){ mark('new'); }; acts.appendChild(b3);
      }
      card.appendChild(acts);
      list.appendChild(card);
    });
  }

  document.querySelector('.bar').addEventListener('click', function(e){
    var b = e.target.closest('button[data-f]'); if(!b) return;
    filter = b.dataset.f;
    document.querySelectorAll('button[data-f]').forEach(function(x){ x.classList.toggle('on', x === b); });
    load();
  });
  $('reload').onclick = load;
  $('forget').onclick = function(){ try{ localStorage.removeItem(KEY); }catch(e){} showGate(''); };
  function enter(){
    var v = $('key').value.trim(); if(!v) return;
    try{ localStorage.setItem(KEY, v); }catch(e){}
    $('key').value = ''; load();
  }
  $('enter').onclick = enter;
  $('key').addEventListener('keydown', function(e){ if(e.key === 'Enter') enter(); });

  key() ? load() : showGate('');
})();

// ── 폰 알림(웹 푸시)과 이 기기에 온 의견 ──────────────────
(function(){
  'use strict';
  // 공개키 — 비밀이 아니다. 짝이 되는 개인키는 워커 비밀값(VAPID_PRIVATE_JWK)에만 있다.
  var VAPID = 'BDfVI4D_iwfsxRAMvkVUddxsU1yKK77MAW2m9qpGGnZDLiUPaJmxsXxfQyFTElab_nxVMMgMm8DeNaYb-gPS8fw';
  var SUB_URL = 'https://case-grader.bar-exam.workers.dev/feedback/push';
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, text){
    var e = document.createElement(tag); if(cls) e.className = cls;
    if(text !== undefined && text !== null) e.textContent = text;   // 남이 쓴 글 — textContent 만
    return e;
  }
  function state(msg, cls){ var s = $('pushState'); s.textContent = msg; s.className = cls || 'muted'; }
  function keyBytes(b64){
    var s = atob(b64.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((b64.length+3)%4));
    var a = new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i] = s.charCodeAt(i); return a;
  }
  var ua = navigator.userAgent;
  var iOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  var label = iOS ? 'iPhone' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : '기기';

  function tell(sub){
    return fetch(SUB_URL, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sub: sub.toJSON(), label: label})})
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){
        if(!r.ok) throw new Error(j.error || ('오류 ' + r.status)); return j; }); });
  }
  function showStatus(j){
    $('pushOn').hidden = true; $('pushOff').hidden = false;
    if(j.status === 'active') state('켜짐 — 새 의견이 이 기기로 옵니다. (신청 #' + j.id + ')', 'okc');
    else state('신청 #' + j.id + ' 접수 — 승인 대기 중. 노트북에서 승인하면 그때부터 옵니다.', 'warn');
  }

  function setup(){
    if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)){
      state(iOS && !standalone
        ? '아이폰은 Safari 공유 버튼 → 「홈 화면에 추가」로 「의견함」 앱을 만든 뒤, 그 앱을 열어 여기서 켜세요.'
        : '이 브라우저는 웹 푸시를 지원하지 않습니다. (안드로이드 크롬, 아이폰 홈 화면 앱에서 됩니다)', 'warn');
      return;
    }
    navigator.serviceWorker.register('/sw.js', {scope: '/'}).then(function(){ return navigator.serviceWorker.ready; })
    .then(function(reg){
      $('pushOn').onclick = function(){
        $('pushOn').disabled = true; state('권한을 묻는 중…');
        Notification.requestPermission().then(function(p){
          if(p !== 'granted') throw new Error('알림 권한이 거부됐습니다. 설정에서 이 사이트 알림을 허용해 주세요.');
          return reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: keyBytes(VAPID)});
        }).then(tell).then(showStatus).catch(function(e){ state(e.message, 'err'); })
        .then(function(){ $('pushOn').disabled = false; });
      };
      $('pushOff').onclick = function(){
        reg.pushManager.getSubscription().then(function(s){ return s && s.unsubscribe(); }).then(function(){
          $('pushOff').hidden = true; $('pushOn').hidden = false;
          state('꺼짐 — 이 기기로는 더 오지 않습니다.');
        });
      };
      return reg.pushManager.getSubscription().then(function(sub){
        if(!sub){
          $('pushOn').hidden = false;
          state(Notification.permission === 'denied'
            ? '이 사이트 알림이 차단돼 있습니다. 브라우저 설정에서 허용한 뒤 켜세요.' : '꺼짐');
          return;
        }
        // 이미 구독 중이면 다시 알려 지금 상태(대기/승인)를 받아 온다 — 서버는 같은 구독을 두 번 넣지 않는다
        return tell(sub).then(showStatus);
      });
    }).catch(function(e){ state(e.message, 'err'); });
  }

  function kst(iso){
    var d = new Date(iso); if(isNaN(d)) return '';
    return d.toLocaleString('ko-KR', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
  }
  function inbox(){
    var box = $('inbox');
    if(!('caches' in window)) return;
    caches.open('fb-inbox').then(function(c){ return c.match('/__fb_inbox__'); })
    .then(function(r){ return r ? r.json() : []; }).catch(function(){ return []; })
    .then(function(list){
      box.textContent = '';
      $('inboxN').textContent = list.length ? '(' + list.length + ')' : '';
      if(!list.length){ box.appendChild(el('div','muted','아직 없습니다. 알림을 켜면 새 의견이 여기에도 쌓입니다.')); return; }
      list.forEach(function(d){
        var card = el('div','card');
        var head = el('div','head');
        head.appendChild(el('span','tag', d.app || '?'));
        head.appendChild(el('span','tag k' + (d.kind || ''), d.kind || ''));
        head.appendChild(el('span', null, '#' + (d.id == null ? '?' : d.id) + ' · ' + kst(d.ts || d.got)));
        if(d.user) head.appendChild(el('span', null, '· ' + d.user));
        card.appendChild(head);
        card.appendChild(el('div','body', d.text || ''));
        var bits = [d.where && ('화면: ' + d.where), d.contact && ('연락처: ' + d.contact)].filter(Boolean);
        if(bits.length){ var c = el('div','ctx'); bits.forEach(function(b){ c.appendChild(el('div', null, b)); }); card.appendChild(c); }
        box.appendChild(card);
      });
    });
  }
  if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', function(e){ if(e.data && e.data.fbInbox) inbox(); });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) inbox(); });
  setup(); inbox();
})();
</script>
</body>
</html>
